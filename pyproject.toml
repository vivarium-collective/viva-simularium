[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-simularium"
version = "0.1.0"
description = "Generic Simularium adapters for viva / process-bigraph: emitted trajectories -> .simularium"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simulariumio",
    "numpy",
    "viva-superpowers",
    "process-bigraph>=0.0.10",
    "bigraph-schema",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_simularium*"]
